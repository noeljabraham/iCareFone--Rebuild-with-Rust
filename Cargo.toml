[package]
name = "icarefone-clone"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Clean-room, offline iOS device management, backup, media, and transfer utility written in Rust"

[dependencies]
aes-gcm = "0.10"
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow"] }
flate2 = "1.1"
hex = "0.4"
hmac = "0.12"
md-5 = "0.10"
plist = "1.7"
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
walkdir = "2.5"
zeroize = { version = "1.8", features = ["derive"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

